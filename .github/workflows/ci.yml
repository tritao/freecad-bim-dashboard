name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test collector
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate browser JavaScript
        run: node --check dashboard/app.js
      - name: Validate sample data
        run: python3 -m json.tool dashboard/data/dashboard.json >/dev/null
